<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>SoniaEmu</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', path='css/style.css') }}"
    />
    <link rel="manifest" href="{{ url_for('static', path='manifest.json') }}" />
    <link
      rel="icon"
      type="image/webp"
      sizes="512x512"
      href="{{ url_for('static', path='icons/512.webp') }}"
    />
  </head>
  <body>
    <div id="orientation-overlay">
      <p>Please rotate your device to landscape mode.</p>
      <p>Add to homescreen for better visibility.</p>
      <hr class="divider" />
      <label for="analog-toggle">
        <input type="checkbox" id="analog-toggle" />
        <span>Analog Triggers</span>
      </label>
      <a class="advanced-link" href="/advanced">Advanced Settings</a>
    </div>
    {% include "_controls.html" %}

    <script src="{{ url_for('static', path='js/settings.js') }}"></script>
    <script src="{{ url_for('static', path='js/joystick.js') }}"></script>
    <script src="{{ url_for('static', path='js/options.js') }}"></script>
    <script src="{{ url_for('static', path='js/analog.js') }}"></script>
  </body>
</html>
